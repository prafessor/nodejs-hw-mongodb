tags:
  - Contacts
summary: Update contact
operationId: updateContact
description: Update contact by id
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: 682394bf1bb6f80c997b44c8
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            description: Contact`s name
            example: Dana Andrikanuch
          phoneNumber:
            type: string
            description: Contact`s phone number
            example: +380951568516
          email:
            type: string
            format: email
            description: Contact`s email
            example: dana@gamil.com
          isFavourite:
            type: string
            description: Contact is favourite
            enum: ["true", "false"]
            example: true
          contactType:
            type: string
            description: Contact`s type
            enum: ["work", "home", "personal"]
            example: "personal"
          photo:
            type: string
            format: binary
            description: Contact`s photo
responses:
  "200":
    description: Updated the contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully patched a contact!
            data:
              type: object
              $ref: ../../../components/schemas/contact.yaml
  '401':
    $ref: ../../../components/responses/401.yaml
  '404':
    $ref: ../../../components/responses/404.yaml
  '500':
    $ref: ../../../components/responses/500.yaml
