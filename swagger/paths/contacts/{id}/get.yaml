tags:
  - Contacts
summary: Get contact by Id
operationId: getContact
description: Get contact by Id
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: 682394bf1bb6f80c997b44c8
responses:
  '200':
    description: 'Get contact by Id'
    content:
      aplication/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contact with id 682394bf1bb6f80c997b44c8!
            data:
              type: object
              $ref: ../../../components/schemas/contact.yaml
  '401':
    $ref: ../../../components/responses/401.yaml
  '404':
    $ref: ../../../components/responses/404.yaml
  '500':
    $ref: ../../../components/responses/500.yaml
