tags:
  -  Contacts
summary: Get contacts
operationId: getContacts
description: Get all contacts
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    schema:
      type: integer
      example: 1
  - in: query
    name: perPage
    schema:
      type: integer
      example: 10
  - in: query
    name: sortBy
    schema:
      type: string
      example: name
      description: all contact`s fields can be mentioned
  - in: query
    name: sortOrder
    schema:
      type: string
      enum: ["asc", "desc"]
      example: asc
  - in: query
    name: type
    schema:
      type: string
      enum: ["work", "home", "personal"]
      example: home
  - in: query
    name: isFavourite
    schema:
      type: string
      enum: ["true", "false"]
      example: true
responses:
  '200':
    description: Successfully found contacts
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Succesfully found contacts!
            data:
              type: object
              required:
                - data
                - page
                - perPage
                - sortBy
                - sortOrder
                - type
                - isFavourite
              properties:
                data:
                  type: array
                  items:
                    $ref: ../../components/schemas/contact.yaml
                page:
                  type: number
                  example: 1
                perPage:
                  type: number
                  example: 10
                totalItems:
                  type: number
                  example: 22
                totalPages:
                  type: number
                  example: 3
                hasNextPage:
                  type: boolean
                  example: true
                hasPreviousPage:
                  type: boolean
                  example: false
  '401':
    $ref: ../../components/responses/401.yaml
  '500':
    $ref: ../../components/responses/500.yaml
